name: Radar scan

on:
  schedule:
    - cron: "40 12 * * 1-5"   # intradía: 8:40 ET en verano (7:40 en invierno), antes de la apertura
    - cron: "35 21 * * 1-5"   # swing: 17:35 ET en verano (16:35 en invierno), después del cierre
  workflow_dispatch:
    inputs:
      horizon:
        description: "A = intradía / pre-market · B = swing 1–20 días"
        required: true
        default: "A"
        type: choice
        options: ["A", "B"]

permissions:
  contents: write

concurrency:
  group: radar-scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Parity check (motor Python = motor de la página)
        run: python tools/parity.py
      - name: Scan
        env:
          SEC_USER_AGENT: ${{ vars.SEC_USER_AGENT }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then H="${{ inputs.horizon }}";
          elif [ "${{ github.event.schedule }}" = "40 12 * * 1-5" ]; then H=A; else H=B; fi
          python -m scanner.scan --horizon "$H"
      - name: Commit results
        run: |
          git config user.name "radar-bot"
          git config user.email "radar-bot@users.noreply.github.com"
          git add data
          git diff --cached --quiet && exit 0
          git commit -m "scan $(date -u +%Y-%m-%dT%H:%MZ)"
          for i in 1 2 3; do git pull --rebase -X theirs && git push && exit 0; sleep 5; done
          exit 1
